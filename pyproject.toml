[project]
name = "entirius-django-lookup"
version = "0.3.0"
description = "Product lookup and deduplication module for Entirius: fingerprints, candidate search, match and review decisions"
keywords = ["django", "deduplication", "product-matching", "pgvector", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.3",
    "entirius-django-utils>=2.0.0",
    "pgvector>=0.3",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "python-stdnum>=1.20",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "psycopg[binary]>=3.1", "dj-database-url>=2.0"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-lookup/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-lookup"
Changelog = "https://github.com/entirius/entirius-django-lookup/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-lookup/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_lookup"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_lookup"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
